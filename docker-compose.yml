version: '3.8'

# ============================================================
# INFRASTRUKTURA MIKROSERWISÓW
# ============================================================
# Uruchomienie: docker-compose up --build
# Zatrzymanie:  docker-compose down -v  (-v usuwa wolumeny/dane)
#
# Kolejność startowania:
# postgres → kafka (KRaft) → [order, inventory, notification]
# (depends_on z condition: service_healthy zapewnia właściwą kolejność)
# ============================================================

services:

  # ============================================================
  # POSTGRESQL — jedna instancja, dwie bazy (orderdb + inventorydb)
  # W produkcji: osobne instancje DB dla każdego serwisu (większa izolacja)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres  # domyślna baza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql  # auto-run przy pierwszym starcie
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # APACHE KAFKA — message broker
  #
  # LISTENERS — dwa listenery:
  #   PLAINTEXT://0.0.0.0:9092  → dla kontenerów w sieci Docker (bootstrap-servers: kafka:9092)
  #   PLAINTEXT_HOST://0.0.0.0:29092 → dla aplikacji na hoście (localhost:29092, np. Kafka UI)
  #   CONTROLLER://0.0.0.0:29093 → wewnętrzny listener KRaft
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Automatyczne tworzenie topicków (w produkcji wyłącz i zarządzaj ręcznie)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"    # wewnętrzna sieć Docker
      - "29092:29092"  # dostęp z hosta (np. Kafka UI, kafkacat)
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 30s
      timeout: 10s
      retries: 10

  # ============================================================
  # KAFKA UI — przeglądarka topicków i wiadomości w przeglądarce
  # Otwórz: http://localhost:8090
  # Świetne do nauki — możesz obserwować eventy w czasie rzeczywistym!
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ============================================================
  # PROMETHEUS — zbiera metryki z mikrousług
  # Otwórz: http://localhost:9090
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    depends_on:
      - order-service
      - inventory-service
      - notification-service
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # ============================================================
  # GRAFANA — dashboardy i wizualizacja metryk
  # Otwórz: http://localhost:3000 (admin/admin)
  # ============================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ============================================================
  # ORDER SERVICE
  # ============================================================
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: orderdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"

  # ============================================================
  # INVENTORY SERVICE
  # ============================================================
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: inventorydb
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"

  # ============================================================
  # NOTIFICATION SERVICE
  # ============================================================
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"

volumes:
  postgres_data:
  grafana_data:
  kafka_data:
