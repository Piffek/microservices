server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    # Używamy zmiennych środowiskowych (ustawianych przez Docker Compose)
    # Domyślne wartości (po ":") działają przy lokalnym uruchomieniu bez Dockera
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:orderdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # create-drop: tworzy schemat przy starcie, usuwa przy zatrzymaniu
      # W produkcji używaj: validate lub none (zarządzanie migracjami przez Flyway/Liquibase)
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      # StringSerializer — wysyłamy payload jako String (JSON)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all: broker potwierdza zapisanie na WSZYSTKICH replikach ISR (In-Sync Replicas)
      # Najwyższy poziom niezawodności, nieco wolniejszy
      acks: all
      # retries: automatyczne ponowienie przy błędzie transientnym
      retries: 3
      properties:
        # Zapobiega duplikatom przy retry (idempotentny producent)
        enable.idempotence: true

# Actuator — endpointy zdrowia (http://localhost:8081/actuator/health)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example: DEBUG
    org.springframework.kafka: INFO
